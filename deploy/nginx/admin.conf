# ==============================================================================
# Nginx Configuration for Vue 3 Admin Panel (admin.pepinieraciumbrud.ro)
# Location on server: /etc/nginx/sites-available/admin.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/admin.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.pepinieraciumbrud.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.pepinieraciumbrud.ro;

    root /var/www/pepinieraciumbrudV2/pepinieraciumbrud-admin/dist;
    index index.html;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/admin.pepinieraciumbrud.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pepinieraciumbrud.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/admin_access.log;
    error_log /var/log/nginx/admin_error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets cache (hashed files in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing: Fall back to index.html for Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

