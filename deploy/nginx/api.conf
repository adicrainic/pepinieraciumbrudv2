# ==============================================================================
# Nginx Configuration for WordPress / WooCommerce Headless API (api.pepinieraciumbrud.ro)
# Location on server: /etc/nginx/sites-available/api.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.pepinieraciumbrud.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pepinieraciumbrud.ro;

    root /var/www/pepinieraciumbrudV2/pepinieraciumbrudshop;
    index index.php;

    # Maximum file upload size (crucial for product photos & media)
    client_max_body_size 64M;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.pepinieraciumbrud.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pepinieraciumbrud.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # WordPress Permalink & REST API routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM processing (adjust socket version to match installed PHP, e.g. php8.2-fpm or php8.3-fpm)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # Static uploads caching (product photos)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # Security Hardening for WordPress
    # ==========================================================================

    # Deny access to sensitive files
    location = /wp-config.php { deny all; }
    location = /wp-config.example.php { deny all; }
    location = /readme.html { deny all; }
    location = /license.txt { deny all; }
    location = /xmlrpc.php { deny all; }

    # Deny access to hidden files and directories (like .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Prevent PHP execution in uploads directory (major security protection!)
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}

