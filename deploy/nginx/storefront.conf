# ==============================================================================
# Nginx Configuration for Nuxt 3 Storefront (pepinieraciumbrud.ro)
# Location on server: /etc/nginx/sites-available/storefront.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/storefront.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Redirect HTTP -> HTTPS (handled automatically by Certbot or uncomment manually)
server {
    listen 80;
    listen [::]:80;
    server_name pepinieraciumbrud.ro www.pepinieraciumbrud.ro;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pepinieraciumbrud.ro www.pepinieraciumbrud.ro;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/pepinieraciumbrud.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pepinieraciumbrud.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/storefront_access.log;
    error_log /var/log/nginx/storefront_error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Direct static assets caching for Nuxt build outputs
    location /_nuxt/ {
        alias /var/www/pepinieraciumbrudV2/pepinieraciumbrud-storefront/.output/public/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files (favicon, robots.txt, logos)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        root /var/www/pepinieraciumbrudV2/pepinieraciumbrud-storefront/.output/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy;
    }

    # Reverse proxy to Nuxt 3 Nitro Server (PM2 on port 3000)
    location / {
        try_files $uri @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

