<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ornBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="60%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="leafGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="leafGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8F3DC"/>
      <stop offset="50%" stop-color="#95D5B2"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A75A38"/>
      <stop offset="30%" stop-color="#C97A53"/>
      <stop offset="70%" stop-color="#D98A63"/>
      <stop offset="100%" stop-color="#8F4226"/>
    </linearGradient>
    <radialGradient id="flowerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E2EAFC"/>
      <stop offset="50%" stop-color="#B6CCFE"/>
      <stop offset="100%" stop-color="#809BCE"/>
    </radialGradient>
    <radialGradient id="flowerPinkGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="50%" stop-color="#FFCCD5"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B4332" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="28" fill="url(#ornBg)"/>
  <circle cx="200" cy="200" r="145" fill="#EEF6F0" opacity="0.75"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#D1E6D7" stroke-width="1.5" stroke-dasharray="4 4"/>

  <ellipse cx="200" cy="312" rx="60" ry="11" fill="#000" opacity="0.09"/>

  <g filter="url(#softShadow)">
    <!-- Terracotta pot / urn base -->
    <path d="M165 268 L170 302 Q200 307 230 302 L235 268 Z" fill="url(#potGrad)"/>
    <!-- Pot rim -->
    <rect x="160" y="260" width="80" height="9" rx="3" fill="#D98A63"/>
    <ellipse cx="200" cy="261" rx="40" ry="3.5" fill="#8F4226" opacity="0.4"/>
    <path d="M168 274 Q200 278 232 274" stroke="#FFE3D4" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Stem / Trunk -->
    <path d="M200 260 L200 220" stroke="#4A3423" stroke-width="10" stroke-linecap="round"/>

    <!-- Lush Ornamental Shrub / Topiary Cloud Foliage -->
    <!-- Lower foliage masses -->
    <circle cx="155" cy="205" r="32" fill="url(#leafGradDark)"/>
    <circle cx="245" cy="205" r="32" fill="url(#leafGradDark)"/>
    <circle cx="140" cy="175" r="30" fill="url(#leafGradDark)"/>
    <circle cx="260" cy="175" r="30" fill="url(#leafGradDark)"/>

    <!-- Mid layer foliage -->
    <circle cx="170" cy="165" r="38" fill="url(#leafGradMid)"/>
    <circle cx="230" cy="165" r="38" fill="url(#leafGradMid)"/>
    <circle cx="150" cy="135" r="32" fill="url(#leafGradMid)"/>
    <circle cx="250" cy="135" r="32" fill="url(#leafGradMid)"/>
    <circle cx="200" cy="185" r="42" fill="url(#leafGradMid)"/>

    <!-- Upper foliage crown -->
    <circle cx="175" cy="115" r="32" fill="url(#leafGradLight)"/>
    <circle cx="225" cy="115" r="32" fill="url(#leafGradLight)"/>
    <circle cx="200" cy="98" r="28" fill="url(#leafGradLight)"/>
    <circle cx="200" cy="140" r="36" fill="url(#leafGradLight)"/>

    <!-- Ornamental Leaf Details & Sprigs -->
    <path d="M130 160 C115 150 115 135 125 125 C135 135 140 148 130 160 Z" fill="#95D5B2"/>
    <path d="M270 160 C285 150 285 135 275 125 C265 135 260 148 270 160 Z" fill="#95D5B2"/>
    <path d="M200 80 C190 68 200 58 200 58 C200 58 210 68 200 80 Z" fill="#B7E4C7"/>
    <path d="M185 88 C172 80 178 70 178 70 C178 70 190 78 185 88 Z" fill="#95D5B2"/>
    <path d="M215 88 C228 80 222 70 222 70 C222 70 210 78 215 88 Z" fill="#95D5B2"/>

    <!-- Delicate Blooming Flowers (Hydrangea style florets) -->
    <!-- Flower Cluster Left -->
    <g transform="translate(155, 140) scale(0.85)">
      <circle cx="-6" cy="0" r="5" fill="url(#flowerGrad)"/>
      <circle cx="6" cy="0" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="-6" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="6" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFEAA7"/>
    </g>
    <!-- Flower Cluster Right -->
    <g transform="translate(245, 145) scale(0.85)">
      <circle cx="-6" cy="0" r="5" fill="url(#flowerPinkGrad)"/>
      <circle cx="6" cy="0" r="5" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="-6" r="5" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="6" r="5" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFEAA7"/>
    </g>
    <!-- Flower Cluster Center-Top -->
    <g transform="translate(200, 115) scale(0.95)">
      <circle cx="-7" cy="0" r="6" fill="url(#flowerPinkGrad)"/>
      <circle cx="7" cy="0" r="6" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="-7" r="6" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="7" r="6" fill="url(#flowerPinkGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#FFF3B0"/>
    </g>
    <!-- Flower Cluster Center-Low -->
    <g transform="translate(185, 185) scale(0.75)">
      <circle cx="-6" cy="0" r="5" fill="url(#flowerGrad)"/>
      <circle cx="6" cy="0" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="-6" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="6" r="5" fill="url(#flowerGrad)"/>
      <circle cx="0" cy="0" r="2" fill="#FFEAA7"/>
    </g>
  </g>

  <text x="200" y="348" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="#1B4332" text-anchor="middle" letter-spacing="1">ARBUȘTI ORNAMENTALI</text>
  <text x="200" y="368" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#52796F" text-anchor="middle" letter-spacing="0.5">Pepiniera Ciumbrud • Tuia, Buxus, Ienupăr &amp; Hortensii</text>
</svg>

