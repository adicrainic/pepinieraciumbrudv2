  </defs>
  
  <rect width="400" height="400" rx="28" fill="url(#apricotBg)"/>
  <circle cx="200" cy="200" r="145" fill="#FFF3E6" opacity="0.7"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#FCE0C3" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <ellipse cx="200" cy="305" rx="66" ry="13" fill="#000" opacity="0.08"/>
  
  <g filter="url(#softShadow)">
    <path d="M200 152 C198 128 208 110 218 100" stroke="#543D2B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M204 126 C238 114 266 130 272 150 C246 158 220 148 204 126 Z" fill="url(#apricotLeaf)"/>
    <path d="M204 126 Q238 138 272 150" stroke="#C5E8D0" stroke-width="1.5" fill="none"/>
    
    <!-- Apricot Body -->
