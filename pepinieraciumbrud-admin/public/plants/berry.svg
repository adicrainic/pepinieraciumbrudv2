<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="berryBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <radialGradient id="raspGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="45%" stop-color="#C9184A"/>
      <stop offset="85%" stop-color="#800F2F"/>
      <stop offset="100%" stop-color="#400515"/>
    </radialGradient>
    <radialGradient id="blueGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4EA8DE"/>
      <stop offset="45%" stop-color="#2B4C7E"/>
      <stop offset="85%" stop-color="#1B2845"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="berryLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B4332" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="28" fill="url(#berryBg)"/>
  <circle cx="200" cy="200" r="145" fill="#EAF4EE" opacity="0.7"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#D3E5D9" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <ellipse cx="200" cy="308" rx="65" ry="12" fill="#000" opacity="0.08"/>
  
  <g filter="url(#softShadow)">
    <!-- Sprig and leaves -->
    <path d="M200 130 C198 100 205 85 215 80" stroke="#4A3B32" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M198 120 C160 100 135 118 125 140 C148 152 180 140 198 120 Z" fill="url(#berryLeaf)"/>
    <path d="M202 120 C240 100 265 118 275 140 C252 152 220 140 202 120 Z" fill="url(#berryLeaf)"/>
    
    <!-- Left Berry (Blueberry/Afin) -->
    <circle cx="160" cy="245" r="32" fill="url(#blueGrad)"/>
    <ellipse cx="152" cy="235" rx="7" ry="5" fill="#90E0EF" opacity="0.5"/>
    <circle cx="160" cy="245" r="7" fill="none" stroke="#1B2845" stroke-width="2.5"/>
    
    <!-- Right Berry (Blackberry/Coacăz) -->
    <circle cx="240" cy="245" r="30" fill="url(#blueGrad)"/>
    <ellipse cx="232" cy="236" rx="6" ry="4" fill="#90E0EF" opacity="0.5"/>
    
    <!-- Central Main Berry (Zmeur / Raspberry) made of drupelets -->
    <g>
      <circle cx="190" cy="180" r="14" fill="url(#raspGrad)"/>
      <circle cx="210" cy="180" r="14" fill="url(#raspGrad)"/>
      <circle cx="178" cy="200" r="15" fill="url(#raspGrad)"/>
      <circle cx="200" cy="200" r="16" fill="url(#raspGrad)"/>
      <circle cx="222" cy="200" r="15" fill="url(#raspGrad)"/>
      <circle cx="185" cy="222" r="15" fill="url(#raspGrad)"/>
      <circle cx="215" cy="222" r="15" fill="url(#raspGrad)"/>
      <circle cx="200" cy="240" r="14" fill="url(#raspGrad)"/>
      <!-- Highlights on central berry -->
      <circle cx="188" cy="177" r="3" fill="#FFF" opacity="0.55"/>
      <circle cx="208" cy="177" r="3" fill="#FFF" opacity="0.55"/>
      <circle cx="198" cy="197" r="3.5" fill="#FFF" opacity="0.55"/>
      <circle cx="198" cy="237" r="3" fill="#FFF" opacity="0.55"/>
    </g>
  </g>
  
  <text x="200" y="348" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="#1B4332" text-anchor="middle" letter-spacing="1">ARBUȘTI • RUBUS &amp; VACCINIUM</text>
  <text x="200" y="368" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#52796F" text-anchor="middle" letter-spacing="0.5">Pepiniera Ciumbrud • Zmeur, Afin, Coacăz &amp; Mure</text>
</svg>