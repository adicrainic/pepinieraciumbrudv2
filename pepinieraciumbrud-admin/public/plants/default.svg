<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="defBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40916C"/>
      <stop offset="60%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#543D2B"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
    <radialGradient id="soilGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6F4E37"/>
      <stop offset="60%" stop-color="#4A3423"/>
      <stop offset="100%" stop-color="#2B1D14"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B4332" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="28" fill="url(#defBg)"/>
  <circle cx="200" cy="200" r="145" fill="#E8F1E9" opacity="0.7"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#D1E3D4" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <ellipse cx="200" cy="305" rx="75" ry="12" fill="#000" opacity="0.08"/>
  
  <g filter="url(#softShadow)">
    <!-- Soil Mound -->
    <path d="M130 290 Q200 265 270 290 C260 302 230 308 200 308 C170 308 140 302 130 290 Z" fill="url(#soilGrad)"/>
    
    <!-- Trunk / Stem -->
    <path d="M200 280 C198 230 203 170 200 130" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M200 180 C201 155 200 130 200 130" stroke="#74C69D" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Top Young Leaves (Sprout) -->
    <path d="M200 130 C190 100 170 90 160 90 C160 105 180 120 200 130 Z" fill="url(#leafGrad)"/>
    <path d="M200 130 C210 100 230 90 240 90 C240 105 220 120 200 130 Z" fill="url(#leafGrad)"/>
    <path d="M200 125 C195 95 200 80 200 80 C200 80 205 95 200 125 Z" fill="#95D5B2"/>
    
    <!-- Middle Leaf Pairs -->
    <path d="M198 170 C165 155 135 170 130 185 C155 195 185 185 198 170 Z" fill="url(#leafGrad)"/>
    <path d="M202 185 C235 170 265 185 270 200 C245 210 215 200 202 185 Z" fill="url(#leafGrad)"/>
    
    <!-- Lower Leaf Pairs -->
    <path d="M198 220 C160 210 130 230 125 245 C152 255 185 242 198 220 Z" fill="url(#leafGrad)"/>
    <path d="M202 235 C240 225 270 245 275 260 C248 270 215 257 202 235 Z" fill="url(#leafGrad)"/>
  </g>
  
  <text x="200" y="348" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="#1B4332" text-anchor="middle" letter-spacing="1">MATERIAL SĂDITOR CERTIFICAT</text>
  <text x="200" y="368" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#52796F" text-anchor="middle" letter-spacing="0.5">Pepiniera Ciumbrud • Tradiție &amp; Calitate Garantată</text>
</svg>