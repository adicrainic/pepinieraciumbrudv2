<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="walnutBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <radialGradient id="shellGrad" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#C29B61"/>
      <stop offset="50%" stop-color="#9C7238"/>
      <stop offset="85%" stop-color="#6E4D1D"/>
      <stop offset="100%" stop-color="#422C0C"/>
    </radialGradient>
    <linearGradient id="huskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95D5B2"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B4332" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="28" fill="url(#walnutBg)"/>
  <circle cx="200" cy="200" r="145" fill="#F1EFE6" opacity="0.7"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#DDD6C3" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <ellipse cx="200" cy="305" rx="60" ry="12" fill="#000" opacity="0.08"/>
  
  <g filter="url(#softShadow)">
    <!-- Branch & green husk leaves -->
    <path d="M190 120 C190 95 205 82 215 78" stroke="#543D2B" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M190 115 C150 95 125 115 115 135 C135 145 170 135 190 115 Z" fill="url(#huskGrad)"/>
    <path d="M195 115 C235 95 260 115 270 135 C250 145 215 135 195 115 Z" fill="url(#huskGrad)"/>
    
    <!-- Walnut Shell Body -->
    <path d="M200 138 
             C165 145 142 180 145 225 
             C148 265 172 298 200 304 
             C228 298 252 265 255 225 
             C258 180 235 145 200 138 Z" 
          fill="url(#shellGrad)"/>
          
    <!-- Walnut Shell Center Ridge -->
    <path d="M200 138 C198 175 196 265 200 304" stroke="#422C0C" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M202 138 C204 175 202 265 202 304" stroke="#DDB87E" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none"/>
    
    <!-- Walnut Grooves and Wrinkles -->
    <path d="M182 170 C165 190 168 220 185 240 C175 260 176 275 190 285" stroke="#422C0C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M218 170 C235 190 232 220 215 240 C225 260 224 275 210 285" stroke="#422C0C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  
  <text x="200" y="348" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="#1B4332" text-anchor="middle" letter-spacing="1">NUC • JUGLANS REGIA</text>
  <text x="200" y="368" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#52796F" text-anchor="middle" letter-spacing="0.5">Pepiniera Ciumbrud • Soiuri Valoroase Nucifere</text>
</svg>