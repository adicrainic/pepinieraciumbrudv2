  </defs>
  
  <rect width="400" height="400" rx="28" fill="url(#plumBg)"/>
  <circle cx="200" cy="200" r="145" fill="#EFE8F5" opacity="0.7"/>
  <circle cx="200" cy="200" r="143" fill="none" stroke="#DCCDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <ellipse cx="200" cy="305" rx="65" ry="13" fill="#000" opacity="0.08"/>
  
  <g filter="url(#softShadow)">
    <path d="M200 145 C198 120 205 102 215 95" stroke="#4B382A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M204 122 C236 112 264 128 270 146 C245 154 220 142 204 122 Z" fill="url(#plumLeaf)"/>
    <path d="M204 122 Q238 134 270 146" stroke="#C5E8D0" stroke-width="1.5" fill="none"/>
    
    <!-- Plum Oval Body -->
    <path d="M200 146 
